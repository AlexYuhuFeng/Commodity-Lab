[package]
name = "commodity_lab_tauri"
version = "1.2.1"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "1.4.3", features = [] }
reqwest = { version = "0.11", features = ["blocking", "json", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "1.4.3", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
