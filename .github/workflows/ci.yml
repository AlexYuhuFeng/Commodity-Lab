name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri/tauri-frontend/package-lock.json

      - name: Frontend regression and build
        working-directory: tauri/tauri-frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Browser workflow and visual regression
        working-directory: tauri/tauri-frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:visual

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: tauri/tauri-frontend/test-results/
          if-no-files-found: ignore
