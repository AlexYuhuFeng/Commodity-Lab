name: Tauri Cross-Platform Build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  APP_NAME: 'Commodity-Lab'
  WINDOWS_ARTIFACT_NAME: 'commodity-lab-windows-x86_64'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tauri/backend/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tauri/backend/requirements.txt
          pip install pytest

      - name: Run Python tests
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tauri/tauri-frontend/package-lock.json

      - name: Run frontend tests and build
        run: |
          cd tauri/tauri-frontend
          npm ci
          npm run test
          npm run build

  build_tauri_windows:
    runs-on: windows-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tauri/backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/tauri-frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Remove stale desktop bundles
        shell: pwsh
        run: Remove-Item -Recurse -Force .\tauri\src-tauri\target\release\bundle -ErrorAction SilentlyContinue

      - name: Package Tauri desktop app
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tauri\scripts\package_tauri.ps1

      - name: Show generated bundle files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse .\tauri\src-tauri\target\release\bundle | Select-Object FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_ARTIFACT_NAME }}
          path: |
            tauri\src-tauri\target\release\bundle\nsis\*-setup.exe
            tauri\src-tauri\target\release\bundle\msi\*.msi
          if-no-files-found: error
          retention-days: 14

  build_tauri_linux:
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            artifact: commodity-lab-linux-x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
            artifact: commodity-lab-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            patchelf \
            wget

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tauri/backend/requirements.txt

      - name: Build native Python backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tauri/backend/requirements.txt pyinstaller
          bash tauri/scripts/build_backend.sh
          file tauri/bundled/backend/commodity_lab_backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/tauri-frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target
          key: linux-${{ matrix.arch }}-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            linux-${{ matrix.arch }}-cargo-

      - name: Build frontend
        working-directory: tauri/tauri-frontend
        run: |
          npm ci
          npm run build

      - name: Build Linux desktop bundles
        working-directory: tauri
        run: |
          rm -rf src-tauri/target/release/bundle
          npm ci
          npm run tauri:build -- --bundles deb,appimage

      - name: Verify Linux bundle architecture
        run: |
          desktop_binary="$(find tauri/src-tauri/target/release -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$desktop_binary"
          binary_info="$(file "$desktop_binary")"
          echo "$binary_info"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            grep -Eq 'ARM aarch64|aarch64' <<<"$binary_info"
          else
            grep -Eq 'x86-64|x86_64' <<<"$binary_info"
          fi
          find tauri/src-tauri/target/release/bundle -maxdepth 3 -type f -print

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            tauri/src-tauri/target/release/bundle/deb/*.deb
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build_tauri_windows, build_tauri_linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: commodity-lab-*
          path: artifacts
          merge-multiple: false

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          NOTES_FILE="release-notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          # Commodity Lab cross-platform release

          ## English
          - Windows x86_64: NSIS and MSI installers.
          - Linux x86_64: Debian package and AppImage.
          - Linux ARM64: Debian package and AppImage.
          - Shared general hedging curriculum with reviewed European Natural Gas and Crude Oil workspaces.
          - AI-streamed cases, visible workspace control, historical replay, and deterministic local scoring.

          ## 中文
          - Windows x86_64：NSIS 与 MSI 安装包。
          - Linux x86_64：Debian 安装包与 AppImage。
          - Linux ARM64：Debian 安装包与 AppImage。
          - 共享套保通识课程，以及经审阅的欧洲天然气与原油工作区。
          - AI 流式案例、可见界面控制、历史复盘与本地即时评分。

          所有安装包仅作为 GitHub Release 附件发布，不进入源码仓库。
          EOF

          mapfile -t files < <(find artifacts -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "Commodity Lab $TAG_NAME" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
