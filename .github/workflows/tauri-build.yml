name: Tauri Windows Build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  APP_NAME: 'Commodity-Lab'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tauri/backend/requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q

  build_tauri_windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build backend
        shell: pwsh
        run: .\tauri\scripts\build_backend.ps1
      - name: Build frontend
        run: |
          cd tauri\tauri-frontend
          npm ci
          npm run build
      - name: Build Tauri (Windows)
        shell: pwsh
        run: |
          cd tauri
          npm ci
          npm run tauri:build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: tauri\src-tauri\target\release\bundle\*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build_tauri_windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows
          path: artifacts
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Publishing $TAG_NAME"
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Tauri release artifacts" || true
          mapfile -t files < <(find artifacts -type f)
          if [ "${#files[@]}" -gt 0 ]; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          fi
