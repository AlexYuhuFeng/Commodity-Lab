name: Tauri Windows Build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  APP_NAME: 'Commodity-Lab'
  ARTIFACT_NAME: 'commodity-lab-windows'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tauri/backend/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tauri/backend/requirements.txt
          pip install pytest

      - name: Run Python tests
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tauri/tauri-frontend/package-lock.json

      - name: Run frontend tests and build
        run: |
          cd tauri/tauri-frontend
          npm ci
          npm run test
          npm run build

  build_tauri_windows:
    runs-on: windows-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tauri/backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/tauri-frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Package Tauri desktop app
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tauri\scripts\package_tauri.ps1

      - name: Show generated bundle files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse .\tauri\src-tauri\target\release\bundle | Select-Object FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: tauri\src-tauri\target\release\bundle\*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build_tauri_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/windows

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          NOTES_FILE="release-notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          Commodity Lab Windows release.

          This build packages the AI-powered energy trading training terminal for Windows. It includes Base Mode market training and supports Haineng-compatible AI Full Power Mode when users provide their own endpoint credentials.
          EOF

          mapfile -t files < <(find artifacts/windows -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          gh release create "$TAG_NAME" "${files[@]}" \
            --title "Commodity Lab $TAG_NAME" \
            --notes-file "$NOTES_FILE" \
            --latest
