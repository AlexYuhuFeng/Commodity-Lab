name: Tauri Build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  APP_NAME: 'Commodity-Lab'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q

  build_backend:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      artifact-name: backend_artifact
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build backend exe
        run: |
          python -m pip install --upgrade pip
          pip install -r tauri/backend/requirements.txt
          pip install pyinstaller
          bash tauri/scripts/build_backend.sh
      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: commodity_lab_backend
          path: tauri/bundled/backend/commodity_lab_backend*

  build_tauri_linux:
    runs-on: ubuntu-latest
    needs: build_backend
    steps:
      - uses: actions/checkout@v5
      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: commodity_lab_backend
          path: tauri/bundled/backend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Build frontend
        run: |
          cd tauri/tauri-frontend
          npm install
          npm run build
      - name: Build Tauri (Linux)
        run: |
          cd tauri
          npm install
          npx tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: src-tauri/target/release/bundle/*

  build_tauri_windows:
    runs-on: windows-latest
    needs: build_backend
    steps:
      - uses: actions/checkout@v5
      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: commodity_lab_backend
          path: tauri\bundled\backend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build frontend
        run: |
          cd tauri\tauri-frontend
          npm install
          npm run build
      - name: Build Tauri (Windows)
        shell: pwsh
        run: |
          cd tauri
          npm install
          npx tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: src-tauri\target\release\bundle\*

  release:
    needs: [build_tauri_linux, build_tauri_windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-linux
          path: artifacts
      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows
          path: artifacts
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Publishing $TAG_NAME"
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Tauri release artifacts" || true
          gh release upload "$TAG_NAME" artifacts/* --clobber || true
